<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textured and Lit Cube Playground</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Textured and Lit Cube Playground</h1>
      <p>WebGL — Lighting, Shading &amp; Texture</p>
    </header>

    <canvas id="glCanvas" width="960" height="600"></canvas>

    <!-- Rows are generated by src/hud.js (addHudRow) -->
    <section id="hud"></section>

    <!-- Hints are generated by src/hud.js (addControlHint) -->
    <section id="controls" class="controls">
      <strong>Kontrol:</strong>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
